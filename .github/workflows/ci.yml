name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The integration tests start their own disposable PostgreSQL cluster from these binaries (see TestPostgres).
      - name: Install PostgreSQL 18 binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo "NEXTSTEP_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Build and run every test
        run: ./mvnw -B verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  migrations:
    name: Released migrations are unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare migrations with the previous commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- src/main/resources/db/migration)
          if [ -n "$changed" ]; then
            echo "::error::Flyway migrations on main must never be edited, renamed, or deleted. Add a new V<n>__ file instead."
            echo "$changed"
            exit 1
          fi
          echo "Only new migrations were added."
