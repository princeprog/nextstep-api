name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The integration tests start their own disposable PostgreSQL cluster from these binaries (see TestPostgres).
      - name: Install PostgreSQL 18 binaries
        timeout-minutes: 10
        run: |
          # A package mirror can stall; give each attempt a deadline and try up to three times.
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update \
              && timeout 300 sudo apt-get install -y postgresql-common \
              && timeout 180 sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y \
              && timeout 300 sudo apt-get install -y postgresql-18; then
              echo "NEXTSTEP_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::Installing PostgreSQL failed or stalled (attempt $attempt of 3)"
            sleep 15
          done
          exit 1
      - name: Build and run every test
        run: ./mvnw -B verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  migrations:
    name: Released migrations are unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare migrations with the previous commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- src/main/resources/db/migration)
          if [ -n "$changed" ]; then
            echo "::error::Flyway migrations on main must never be edited, renamed, or deleted. Add a new V<n>__ file instead."
            echo "$changed"
            exit 1
          fi
          echo "Only new migrations were added."

  image:
    name: Container image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: nextstep
          POSTGRES_DB: nextstep
          # A throwaway database for this job only; the value changes with every run.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextstep -d nextstep"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag nextstep-api:ci .
      - name: Start it with production settings and check health
        env:
          DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run --detach --name api --network host \
            --env DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/nextstep \
            --env DATABASE_USER=nextstep \
            --env DATABASE_PASSWORD="$DB_PASSWORD" \
            --env APP_PUBLIC_ORIGIN=https://app.nextstep.example \
            --env IDENTIFIER_HASH_KEY="$(openssl rand -hex 32)" \
            --env MAIL_MODE=smtp --env MAIL_HOST=127.0.0.1 --env MAIL_SMTP_AUTH=false --env MAIL_STARTTLS=false \
            --env "MAIL_FROM=NextStep <no-reply@nextstep.example>" \
            nextstep-api:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/actuator/health/readiness; then
              echo "Ready after $attempt checks"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::The API container stopped during startup"
              exit 1
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/health | grep -q '"status":"UP"'
          if [ "$(docker exec api id -u)" = "0" ]; then
            echo "::error::The API container runs as root"
            exit 1
          fi
          echo "The image starts in the production profile, migrates the database, and reports healthy as a non-root user."
      - name: Show the API log
        if: failure()
        run: docker logs api || true
