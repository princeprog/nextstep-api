# Production profile: SPRING_PROFILES_ACTIVE=production. Secrets still come only from the environment, and startup
# fails when a required setting is missing or only safe locally (see ProductionSettingsCheck).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=__Host-NEXTSTEP_SESSION
logging.structured.format.console=ecs
