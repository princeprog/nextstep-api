spring.application.name=nextstep-api

# Database (local defaults match scripts/db-dev.ps1; never commit real credentials)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/nextstep}
spring.datasource.username=${DATABASE_USER:nextstep}
spring.datasource.password=${DATABASE_PASSWORD:}
# Keep column values (for example an email in a duplicate-key error) out of exception messages and logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Set FLYWAY_ENABLED=false when migrations run as a separate release step (see README, "Releasing a migration").
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Sessions are stored in PostgreSQL through Spring Session JDBC (schema created by Flyway)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=NEXTSTEP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.path=/

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.security=WARN

# Public origin of the web app. Reserved for links in emails; the production profile requires a public https value.
nextstep.app-public-origin=${APP_PUBLIC_ORIGIN:http://localhost:3000}
nextstep.max-request-bytes=${MAX_REQUEST_BYTES:262144}
nextstep.maintenance-interval=${MAINTENANCE_INTERVAL:PT15M}
nextstep.demo.ttl-hours=${DEMO_TTL_HOURS:24}
nextstep.demo.cleanup-interval=${DEMO_CLEANUP_INTERVAL:PT15M}
nextstep.demo.max-applications=100
nextstep.demo.max-tasks=500
nextstep.demo.max-interviews=200
nextstep.rate-limit.demo-per-hour=${DEMO_RATE_LIMIT_PER_HOUR:5}
nextstep.rate-limit.demo-global-per-hour=${DEMO_GLOBAL_RATE_LIMIT_PER_HOUR:300}
nextstep.rate-limit.login-per-window=${LOGIN_RATE_LIMIT_PER_WINDOW:10}
# Failed sign-ins per email from any address; much higher than the per-address limit so nobody can lock an owner out.
nextstep.rate-limit.login-failures-per-email-per-window=${LOGIN_EMAIL_RATE_LIMIT_PER_WINDOW:50}
nextstep.rate-limit.login-window=PT15M
nextstep.rate-limit.register-per-hour=${REGISTER_RATE_LIMIT_PER_HOUR:10}
nextstep.rate-limit.register-per-email-per-hour=${REGISTER_EMAIL_RATE_LIMIT_PER_HOUR:5}
# Verification resends and password-reset requests, per client address and per email address.
nextstep.rate-limit.email-requests-per-hour=${EMAIL_REQUEST_RATE_LIMIT_PER_HOUR:10}
nextstep.rate-limit.email-requests-per-email-per-hour=${EMAIL_REQUEST_EMAIL_RATE_LIMIT_PER_HOUR:3}
# Confirmation and reset link submissions per client address per 15 minutes.
nextstep.rate-limit.token-attempts-per-window=${LINK_RATE_LIMIT_PER_WINDOW:30}
# Wrong current passwords (password change, account deletion) per account per 15 minutes.
nextstep.rate-limit.password-checks-per-window=${PASSWORD_CHECK_RATE_LIMIT_PER_WINDOW:5}
nextstep.rate-limit.exports-per-hour=${EXPORT_RATE_LIMIT_PER_HOUR:10}
# Shared by every API instance so rate-limit rows match; required in production. Locally a random key is used.
nextstep.security.identifier-key=${IDENTIFIER_HASH_KEY:}
nextstep.security.max-concurrent-password-hashes=${MAX_CONCURRENT_PASSWORD_HASHES:4}

# Email. MAIL_MODE=log (local default) writes emails, including their links, to the log instead of sending them.
# MAIL_MODE=smtp sends through any provider's SMTP service; the production profile requires it.
nextstep.mail.mode=${MAIL_MODE:log}
nextstep.mail.from=${MAIL_FROM:NextStep <no-reply@localhost>}
nextstep.mail.global-per-hour=${EMAIL_GLOBAL_LIMIT_PER_HOUR:200}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Accounts and passwords
nextstep.passwords.breach-check=${PASSWORD_BREACH_CHECK:true}
nextstep.accounts.unverified-ttl=${UNVERIFIED_ACCOUNT_TTL:P7D}
nextstep.accounts.deletion-ledger-retention=${DELETION_LEDGER_RETENTION:P35D}
nextstep.accounts.max-applications=${MAX_APPLICATIONS_PER_ACCOUNT:2000}
nextstep.accounts.max-tasks=${MAX_TASKS_PER_ACCOUNT:10000}
nextstep.accounts.max-interviews=${MAX_INTERVIEWS_PER_ACCOUNT:2000}

